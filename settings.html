<!DOCTYPE html>
<html lang="uz" data-theme="light">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Main - Sozlamalar</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/inputs.css" />
    <link rel="stylesheet" href="css/theme.css" />
    <link rel="stylesheet" href="css/responsive.css" />

    <style>
        /* ============================================================
           SETTINGS STYLES - TELEFON UCHUN
           ============================================================ */
        .settings-container {
            padding: 16px 20px;
            max-width: 700px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .settings-card {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 20px 24px;
            border: 1px solid var(--border-color);
        }

        .settings-card h3 {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 14px;
        }

        .settings-card h3 i {
            margin-right: 8px;
            color: var(--text-muted);
        }

        .settings-card .form-group {
            margin-bottom: 14px;
        }

        .settings-card .form-group:last-of-type {
            margin-bottom: 18px;
        }

        .settings-card.danger {
            border-color: var(--color-danger);
        }

        .settings-card.danger h3 {
            color: var(--color-danger);
        }

        .settings-card.danger p {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 14px;
        }

        .settings-actions {
            display: flex;
            gap: 10px;
        }

        /* ⭐ THEME OPTIONS */
        .theme-options {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .theme-option {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            padding: 10px 16px;
            border: 2px solid var(--border-color);
            border-radius: var(--radius-sm);
            background: var(--bg-card);
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.3s ease;
            min-width: 70px;
            flex: 1;
            max-width: 120px;
        }

        .theme-option:hover {
            border-color: var(--text-muted);
            transform: translateY(-2px);
        }

        .theme-option.active {
            border-color: var(--text-primary);
            color: var(--text-primary);
            background: var(--bg-active);
        }

        .theme-option i {
            font-size: 1.1rem;
        }

        .theme-option span {
            font-size: 0.7rem;
            font-weight: 500;
        }

        /* ⭐ PROFILE DISPLAY */
        .profile-display {
            background: var(--bg-hover);
            border-radius: var(--radius-sm);
            padding: 14px 18px;
            margin-bottom: 18px;
        }

        .profile-display .field {
            display: flex;
            padding: 5px 0;
            border-bottom: 1px solid var(--border-color);
        }

        .profile-display .field:last-child {
            border-bottom: none;
        }

        .profile-display .field .label {
            font-weight: 500;
            color: var(--text-muted);
            width: 70px;
            flex-shrink: 0;
            font-size: 0.85rem;
        }

        .profile-display .field .value {
            color: var(--text-primary);
            font-weight: 500;
            font-size: 0.85rem;
            word-break: break-word;
        }

        /* ============================================================
           TELEFON UCHUN RESPONSIVE
           ============================================================ */
        @media (max-width: 768px) {
            .settings-container {
                padding: 12px 14px;
            }

            .settings-card {
                padding: 14px 16px;
                border-radius: 12px;
            }

            .settings-actions {
                flex-direction: column;
            }

            .settings-actions .btn-secondary,
            .settings-actions .btn-danger {
                width: 100%;
                justify-content: center;
            }

            .theme-options {
                flex-direction: row;
                flex-wrap: wrap;
            }

            .theme-option {
                max-width: 100%;
                flex: 1;
                min-width: 60px;
                padding: 8px 12px;
                flex-direction: row;
                justify-content: center;
            }

            .profile-display .field {
                flex-direction: column;
                gap: 2px;
                padding: 4px 0;
            }

            .profile-display .field .label {
                width: 100%;
                font-size: 0.7rem;
            }

            .profile-display .field .value {
                font-size: 0.8rem;
            }

            .top-header {
                padding: 10px 14px;
            }

            .top-header h2 {
                font-size: 0.95rem;
            }

            .top-header .text-muted {
                font-size: 0.7rem;
            }

            .header-left .text-muted {
                display: none;
            }

            .user-info {
                display: none;
            }
        }

        @media (max-width: 480px) {
            .settings-container {
                padding: 8px 10px;
            }

            .settings-card {
                padding: 12px 14px;
            }

            .settings-card h3 {
                font-size: 0.85rem;
            }

            .form-group label {
                font-size: 0.8rem;
            }

            .input-wrapper input,
            .input-wrapper select,
            .input-wrapper textarea {
                padding: 8px 12px;
                font-size: 0.8rem;
                border-radius: 8px;
            }

            .btn-primary,
            .btn-secondary,
            .btn-danger {
                padding: 8px 14px;
                font-size: 0.8rem;
            }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-brand">
                <div class="brand-icon"><i class="fas fa-crown"></i></div>
                <span>Admin Main</span>
                <span class="brand-version">v1.0</span>
            </div>
            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-link" data-nav-label="navDashboard"><i class="fas fa-chart-pie"></i> Dashboard</a>
                <a href="admins.html" class="nav-link" data-nav-label="navAdmins"><i class="fas fa-users"></i> Admin Customerlar</a>
                <a href="admin-add.html" class="nav-link" data-nav-label="navAdd"><i class="fas fa-user-plus"></i> Yangi Admin</a>
                <a href="settings.html" class="nav-link active" data-nav-label="navSettings"><i class="fas fa-cog"></i> Sozlamalar</a>
            </nav>
            <div class="sidebar-footer">
                <button id="logoutBtn" class="btn-logout"><i class="fas fa-sign-out-alt"></i> Chiqish</button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="top-header">
                <div class="header-left">
                    <button id="menuToggle" class="menu-toggle"><i class="fas fa-bars"></i></button>
                    <div>
                        <h2 data-i18n="settingsTitle">Sozlamalar</h2>
                        <p class="text-muted" data-i18n="settingsSubtitle">Tizim sozlamalarini boshqaring</p>
                    </div>
                </div>
                <div class="header-right">
                    <button class="theme-toggle-small" id="themeToggleSmall"><i class="fas fa-moon"></i></button>
                    <div class="user-profile">
                        <div class="user-avatar" id="userAvatar">
                            <span id="userInitial">A</span>
                        </div>
                        <div class="user-info">
                            <p class="user-name" id="userName">Admin</p>
                            <p class="user-role text-muted">Admin Main</p>
                        </div>
                    </div>
                </div>
            </header>

            <section class="settings-container">
                <!-- ⭐ PROFIL -->
                <div class="settings-card">
                    <h3><i class="fas fa-user-shield"></i> Profil</h3>
                    
                    <!-- ⭐ JORIY PROFIL MA'LUMOTLARI -->
                    <div class="profile-display">
                        <div class="field">
                            <span class="label">F.I.SH</span>
                            <span class="value" id="profileNameDisplay">-</span>
                        </div>
                        <div class="field">
                            <span class="label">Email</span>
                            <span class="value" id="profileEmailDisplay">-</span>
                        </div>
                        <div class="field">
                            <span class="label">Telefon</span>
                            <span class="value" id="profilePhoneDisplay">-</span>
                        </div>
                    </div>

                    <!-- ⭐ PROFIL TAHRIRLASH -->
                    <form id="profileForm">
                        <div class="form-group">
                            <label for="settingsName"><i class="fas fa-user"></i> F.I.SH</label>
                            <div class="input-wrapper">
                                <input type="text" id="settingsName" placeholder="Ismingizni kiriting" />
                                <i class="fas fa-check-circle input-icon success"></i>
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="settingsEmail"><i class="fas fa-envelope"></i> Email</label>
                            <div class="input-wrapper">
                                <input type="email" id="settingsEmail" placeholder="Email kiriting" />
                                <i class="fas fa-check-circle input-icon success"></i>
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="settingsPhone"><i class="fas fa-phone"></i> Telefon</label>
                            <div class="input-wrapper">
                                <input type="text" id="settingsPhone" placeholder="+998 90 123 45 67" />
                                <i class="fas fa-check-circle input-icon success"></i>
                            </div>
                        </div>
                        <button type="submit" class="btn-primary"><i class="fas fa-save"></i> Yangilash</button>
                    </form>
                </div>

                <!-- ⭐ PAROL -->
                <div class="settings-card">
                    <h3><i class="fas fa-key"></i> Parol</h3>
                    <form id="passwordForm">
                        <div class="form-group">
                            <label for="oldPassword"><i class="fas fa-lock"></i> Eski parol</label>
                            <div class="input-wrapper">
                                <input type="password" id="oldPassword" placeholder="••••••••" />
                                <button type="button" class="password-toggle" data-target="oldPassword">
                                    <i class="fas fa-eye"></i>
                                </button>
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="newPassword"><i class="fas fa-lock"></i> Yangi parol</label>
                            <div class="input-wrapper">
                                <input type="password" id="newPassword" placeholder="••••••••" minlength="6" />
                                <button type="button" class="password-toggle" data-target="newPassword">
                                    <i class="fas fa-eye"></i>
                                </button>
                            </div>
                            <span class="input-help"><i class="fas fa-info-circle"></i> Parol kamida 6 ta belgi</span>
                        </div>
                        <div class="form-group">
                            <label for="confirmPassword"><i class="fas fa-check"></i> Parolni tasdiqlang</label>
                            <div class="input-wrapper">
                                <input type="password" id="confirmPassword" placeholder="••••••••" />
                                <button type="button" class="password-toggle" data-target="confirmPassword">
                                    <i class="fas fa-eye"></i>
                                </button>
                            </div>
                        </div>
                        <button type="submit" class="btn-primary"><i class="fas fa-key"></i> Parolni yangilash</button>
                    </form>
                    <div id="passwordMessage" class="form-message"></div>
                </div>

                <!-- ⭐ THEME -->
                <div class="settings-card">
                    <h3><i class="fas fa-palette"></i> <span data-i18n="themeTitle">Tashqi ko'rinish</span></h3>
                    <div class="theme-options">
                        <button class="theme-option active" data-theme="light" id="themeLight">
                            <i class="fas fa-sun"></i>
                            <span>Yorug'</span>
                        </button>
                        <button class="theme-option" data-theme="dark" id="themeDark">
                            <i class="fas fa-moon"></i>
                            <span>Qorong'u</span>
                        </button>
                        <button class="theme-option" data-theme="system" id="themeSystem">
                            <i class="fas fa-desktop"></i>
                            <span>Avtomatik</span>
                        </button>
                    </div>
                    <p class="text-muted" style="margin-top: 12px; font-size: 0.75rem;">
                        <i class="fas fa-info-circle"></i> 
                        <span id="themeStatus">Hozirgi holat: Yorug'</span>
                    </p>
                </div>

                <!-- ⭐ XAVFLI ZONA -->
                <div class="settings-card danger">
                    <h3><i class="fas fa-exclamation-triangle"></i> Xavfli zona</h3>
                    <p>Tizimdan chiqish</p>
                    <div class="settings-actions">
                        <button id="settingsLogout" class="btn-secondary"><i class="fas fa-sign-out-alt"></i> Chiqish</button>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- Theme Toggle -->
    <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
        <i class="fas fa-moon moon"></i>
    </button>

    <!-- ⭐ SCRIPTS -->
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/language.js"></script>
    <script src="js/app.js"></script>
    <script src="js/notifications.js"></script>
    <script src="js/settings.js"></script>
</body>
</html>
